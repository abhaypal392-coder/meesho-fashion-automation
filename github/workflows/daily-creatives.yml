
name: Build daily product creatives

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate approved product creatives
        run: python build_creatives.py

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-creatives
          path: output/
          if-no-files-found: warn
          retention-days: 7
